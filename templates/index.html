<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        AI Handwritten Digit Recognition
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

    <div class="container">

        <!-- Header -->

        <header class="header">

            <h1>
                AI Handwritten Digit Recognition
            </h1>

            <p>
                CNN-Based MNIST Digit Classification
            </p>

        </header>


        <!-- Upload -->

        <section class="card">

            <h2>
                📤 Upload a Digit Image
            </h2>

            <div class="upload-area">

                <input
                    type="file"
                    id="imageInput"
                    accept=".png,.jpg,.jpeg,.bmp"
                >

                <button
                    id="uploadButton"
                >
                    Predict Uploaded Image
                </button>

            </div>

        </section>


        <!-- Drawing -->

        <section class="card">

            <h2>
                ✏️ Draw a Digit
            </h2>

            <div class="canvas-container">

                <canvas
                    id="drawingCanvas"
                    width="280"
                    height="280"
                ></canvas>

            </div>

            <div class="button-group">

                <button
                    id="predictDrawing"
                >
                    Predict Drawing
                </button>

                <button
                    id="clearCanvas"
                    class="secondary-button"
                >
                    Clear
                </button>

            </div>

        </section>


        <!-- Result -->

        <section class="card result-card">

            <h2>
                🔍 Prediction Result
            </h2>

            <div
                id="result"
                class="result"
            >
                Draw or upload a digit to begin.
            </div>

        </section>


        <!-- Footer -->

        <footer class="footer">

            <p>
                AI-Based Handwritten Digit Recognition
                using Convolutional Neural Networks
            </p>

            <p>
                MNIST Dataset • TensorFlow • Keras • Flask
            </p>

        </footer>

    </div>


    <script
        src="{{ url_for('static', filename='script.js') }}"
    ></script>

</body>

</html>
